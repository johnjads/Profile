[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aaf-reliability-reference"
version = "0.2.0"
description = "Reliability-control reference components and evaluation utilities for the AAF Assistant research study"
requires-python = ">=3.10"
authors = [{name="Johnson Ang"}]
license = {text="MIT"}
readme = "README.md"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
